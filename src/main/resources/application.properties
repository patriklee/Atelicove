spring.application.name=${SPRING_APPLICATION_NAME:Atelicove}

# MySQL Database Configuration (Docker)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/atelicoveDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:atelicove_user}
spring.datasource.password=${DB_PASSWORD:atelicove_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Hibernate Configuration
# (Optional) You can remove this line entirely; Spring Boot will auto-detect the dialect
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# For first run, use update so tables can be created if needed
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Comma-separated frontend origins allowed to use the session cookie.
atelicove.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
